services:
  floci:
    image: floci/floci:latest
    ports:
      - "4566:4566"
      - "7001:7001"
    environment:
      FLOCI_SERVICES_RDS_ENABLED: "true"
      FLOCI_SERVICES_RDS_MOCK: "false"
      FLOCI_SERVICES_RDS_PROXY_BASE_PORT: "7001"
      FLOCI_SERVICES_RDS_PROXY_MAX_PORT: "7001"
      FLOCI_SERVICES_RDS_ENDPOINT_HOST: "localhost"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - floci-data:/app/data

volumes:
  floci-data: